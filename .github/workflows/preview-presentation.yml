name: Probar pantalla amplia y diseños
on:
  push:
    branches: [codex/presentation-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/presentation-order.cjs && node tests/wide-order-preview.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: prueba-pantalla-amplia
          path: test-results/
